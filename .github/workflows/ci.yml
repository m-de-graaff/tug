name: ci

# Every gate the roadmap names, wired from the first release. The budgets are
# the product's claims; a claim without a gate is a wish.
#
# Ordering is cheapest-first: a formatting mistake should cost ten seconds, not
# the whole matrix. Independent jobs run in parallel; the wall-clock budget is
# five minutes and `wall-clock` fails the run if it is exceeded.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, per DR-001. Bumping this is a changelog event, never a surprise.
  ZIG_VERSION: 0.16.0

jobs:
  # --- seconds ------------------------------------------------------------

  fmt:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src

  no-network:
    name: network stays confined
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No toolchain needed: this is a grep, and it stays a grep so it cannot
      # fail for any reason other than the one it exists to catch.
      - run: sh scripts/no-network.sh src

  canary:
    name: no keys checked in
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Also a grep, also no toolchain. Fixtures record the response side only,
      # and this is what makes that a fact rather than a habit.
      - run: sh scripts/canary-grep.sh testdata

  # --- the bulk of the signal ---------------------------------------------

  test:
    name: test (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Debug runs the DebugAllocator, so a leaked byte is a failed test.
        # ReleaseSafe keeps bounds, overflow and cast checks on over the same
        # suite — the modes catch different bugs, so both are required.
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Inside a network namespace with no interfaces: a test that opens a socket
      # fails here rather than flaking, which is what makes "CI never touches a
      # network" a fact instead of a promise (DR-016).
      - run: sh scripts/offline.sh zig build test -Doptimize=${{ matrix.optimize }} --summary all

  wasm:
    name: tugcore is freestanding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The sans-IO discipline, enforced by the toolchain rather than by
      # memory. Importing std.fs, std.posix, std.Thread or std.time into
      # tugcore fails here.
      - run: zig build wasm-check

  # --- budgets ------------------------------------------------------------

  size:
    name: binary size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The budget is stated for a static Linux x86_64 build, so it is measured
      # against exactly that and not against whatever the runner happens to be.
      - run: zig build -Dtarget=x86_64-linux-musl
      # The roadmap's ceiling: what v0.1 promised.
      - run: sh scripts/size-gate.sh zig-out/bin/tug 512000
      # The ratchet: what v0.1 costs, plus ten per cent. Keep this in step with
      # `size_ratchet_bytes` in build.zig; a legitimate increase is a changelog
      # line, per the roadmap's "budgets never silently loosen".
      - run: sh scripts/size-gate.sh zig-out/bin/tug 216064

  version-latency:
    name: --version under 2 ms
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: |
          curl -fsSL -o hyperfine.deb \
            https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          sudo dpkg -i hyperfine.deb
      - run: zig build
      - run: sh scripts/bench-version.sh zig-out/bin/tug

  first-paint:
    name: cold start under 10 ms
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The roadmap's headline latency claim, and the one budget that could not
      # be measured until Phase 6 gave the shell a prompt to paint. The binary
      # times itself; the script says why that is more honest than wrapping a
      # pty in hyperfine.
      - run: zig build
      - run: sh scripts/first-paint.sh zig-out/bin/tug

  idle-budget:
    name: idle under 10 MiB and 0% CPU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Both numbers were measured by hand on a Linux pty in Phase 3 and by
      # nothing since. A loop that starts busy-waiting is what this catches, and
      # no other gate in this file can see it.
      - run: zig build
      - run: sh scripts/idle-budget.sh zig-out/bin/tug

  # --- platform -----------------------------------------------------------

  terminal-matrix:
    name: terminals degrade rather than hang
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Phase 1's probe-hygiene item, as a gate: on a terminal that answers
      # neither query, `--caps` degrades inside its budget rather than hanging.
      # It used to hang, which is carried item 1 and the reason this row exists.
      # The four terminal-emulator rows are not scriptable anywhere and are
      # recorded as unrecorded in docs/terminal-matrix.md.
      - run: zig build
      - run: sh scripts/terminal-matrix.sh zig-out/bin/tug

  windows-compile:
    name: windows compiles (tier-2)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # Windows is tier-2 until v0.9: it must compile and the tests must pass.
      # Terminal certification is explicitly not promised here.
      - run: zig build
      - run: zig build test
      # A runner has no console, so what this asserts is the refusal: tug says
      # so and exits 0 rather than failing with a bare `error.Unexpected`. That
      # is a real regression this job could not previously see — `open()` used
      # to check only the input handle, so a redirected stdout got past it and
      # died in `enterRaw`.
      #
      # What this still cannot see is the shell actually running, because that
      # needs a console. The stack overflow fixed in this phase was invisible to
      # every gate in this file; see item 50 in the phase TODO.
      - name: a redirected stdout is refused, not fumbled
        shell: pwsh
        run: |
          $out = & .\zig-out\bin\tug.exe 2>&1
          if ($LASTEXITCODE -ne 0) { throw "expected exit 0, got $LASTEXITCODE : $out" }
          if ($out -notmatch 'not a terminal') { throw "expected the refusal message, got: $out" }
          Write-Output "refused cleanly: $out"

  mock-modes:
    name: every fault mode behaves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # A pty, and therefore `Loop.run`'s own body, which no portable unit test
      # can drive. It is also the only gate that has ever caught a liveness bug
      # in the loop: both of the ones fixed in Phase 5 need a real producer
      # thread outrunning a real terminal to appear at all.
      - run: zig build
      - run: sh scripts/mock-modes.sh zig-out/bin/tug

  editor-session:
    name: the editor behaves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # A pty, and therefore the editor as a user meets it: keystrokes through a
      # real terminal, a turn started and interrupted, and a history file that
      # outlives the process that wrote it. The in-process goldens pin the
      # bytes; this pins the behaviour they cannot see.
      - run: zig build
      - run: sh scripts/editor-session.sh zig-out/bin/tug

  theme-session:
    name: themes reach the terminal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The six goldens pin what the encoder emits and `--debug-config` pins
      # what the loader resolved. Neither can say whether the theme reaches the
      # renderer of a running shell, because only `repl.run` wires them together
      # and only a pty runs it.
      - run: zig build
      - run: sh scripts/theme-session.sh zig-out/bin/tug

  command-session:
    name: commands reach the terminal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The five goldens pin what each command prints and the unit tests pin the
      # router's decisions. Neither can say whether a slash typed into a running
      # shell reaches a handler, because only `repl.run` wires them together and
      # only a pty runs it.
      - run: zig build
      - run: sh scripts/command-session.sh zig-out/bin/tug

  soak-session:
    name: a thousand interactions, leak-free
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The roadmap's leak criterion, verbatim. Debug, because that is the build
      # whose allocator counts; tmux, because the mix includes resizes and only
      # something outside the process can deliver one.
      - run: zig build -Doptimize=Debug
      - run: sh scripts/soak-session.sh zig-out/bin/tug

  sse-dump:
    name: recorded bytes decode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The unit tests pin the parser's behaviour in process. This pins what the
      # binary prints from a fixture on disk, which is the thing a human looks at
      # when a provider misbehaves. Debug, because `dev` subcommands are not
      # reachable from a release build.
      - run: zig build -Doptimize=Debug
      - run: |
          sh scripts/offline.sh sh scripts/sse-dump.sh zig-out/bin/tug \
            testdata/fixtures/anthropic/clean-turn.sse \
            testdata/golden/sse-dump-clean-turn.txt

  fixture-replay:
    name: fixtures replay byte for byte
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The roadmap's exit criterion, verbatim, as a job name: every recorded
      # response through the whole provider stack, compared byte for byte
      # against the StreamEvent ndjson it must produce - at five chunk sizes,
      # because a read boundary has to be invisible above the transport seam.
      - run: sh scripts/offline.sh zig build replay --summary all

  valgrind:
    name: memcheck (scoped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # ReleaseSafe, because Debug carries the DebugAllocator and that is a
      # different gate catching different bugs. The scope is one mock turn until
      # Phase 10 points this at the SSE parser, the mappers and the transport.
      - run: zig build -Doptimize=ReleaseSafe
      - run: sh scripts/offline.sh sh scripts/valgrind-scope.sh zig-out/bin/tug

  # --- the meta-gate ------------------------------------------------------

  wall-clock:
    name: ci under 5 min
    runs-on: ubuntu-24.04
    needs:
      [
        fmt,
        no-network,
        canary,
        test,
        wasm,
        size,
        version-latency,
        first-paint,
        idle-budget,
        terminal-matrix,
        windows-compile,
        mock-modes,
        editor-session,
        theme-session,
        command-session,
        soak-session,
        sse-dump,
        fixture-replay,
        valgrind,
      ]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: fail if any gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "a required gate failed; see the jobs above" >&2
          exit 1
      - name: check wall clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --jq '.run_started_at')
          elapsed=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          budget=300
          echo "ci wall clock: ${elapsed}s (budget ${budget}s)"
          if [ "$elapsed" -gt "$budget" ]; then
            echo "over the CI wall-clock budget" >&2
            exit 1
          fi
